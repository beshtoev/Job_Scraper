name: Company Portal Watcher

on:
  schedule:
    # FALLBACK since 2026-09-26. The local runner (scripts/local_runner.py) polls the portals
    # every 3 hours from a home connection; the `fresh` job below stands this down while it
    # does. This used to be the only poll, once a day at 08:00 UTC Monday-Saturday, so a
    # Saturday-afternoon posting waited ~40h. Every 3 hours, every day, when the Mac is off.
    - cron: "10 */3 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Optional number of company portals for a diagnostic run"
        required: false
        type: string

concurrency:
  group: job-scraper-commit-push
  cancel-in-progress: false

jobs:
  fresh:
    name: Stand down if the local runner has the portals covered
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            output/scrape_state.json
            scripts/skip_if_fresh.py
          sparse-checkout-cone-mode: false
      - id: check
        # Runner cadence is 3h; 6h allows one missed poll. A manual run always polls.
        run: python3 scripts/skip_if_fresh.py company_portals 360
        env:
          BACKFILL: ${{ github.event_name == 'workflow_dispatch' }}

  scrape:
    name: Poll company portals
    needs: fresh
    if: needs.fresh.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Poll resolved portals and discovery boards
        shell: bash
        run: |
          args=()
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            args+=(--limit "${{ github.event.inputs.limit }}")
          fi
          python portal_scraper.py "${args[@]}"
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          NOTIFY_MIN_FIT: ${{ vars.NOTIFY_MIN_FIT }}

      - name: Record workflow run
        if: always()
        run: |
          python - <<'EOF'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          status_path = Path("output/company_portal_status.json")
          status = json.loads(status_path.read_text()) if status_path.exists() else {}
          entry = {
              "workflow": "company_portals",
              "timestamp": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "job_count": int(status.get("unique_jobs", 0)),
              "source_status": status.get("status_counts", {"failed": "run did not produce status"}),
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT", ""),
          }
          Path("output").mkdir(exist_ok=True)
          with open("output/workflow_runs.jsonl", "a", encoding="utf-8") as handle:
              handle.write(json.dumps(entry, sort_keys=True) + "\n")
          EOF

      - name: Add geography (office location, distance from home)
        # Fail soft: a geocoding/research problem must never block saving scraped jobs.
        continue-on-error: true
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then pip install --quiet anthropic; fi
          python enrich_geography.py output/company_portal_jobs.json output/all_jobs.json
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit results to repo
        if: always() && vars.ENABLE_DATA_COMMITS == 'true'
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add -f output/company_portal_jobs.json output/company_portal_jobs.md output/company_portal_jobs.html output/company_portal_status.json output/workflow_runs.jsonl output/all_jobs.json output/notified.json
          # geo_cache.json is only written when enrich_geography.py actually
          # changes something (see its no-op guard); a light run may not touch it.
          [ -f output/geo_cache.json ] && git add -f output/geo_cache.json || true
          git diff --cached --quiet || git commit -m "chore: update company portal listings [$(date -u '+%Y-%m-%d %H:%MZ')]"
          git pull --rebase -X ours origin main
          git push

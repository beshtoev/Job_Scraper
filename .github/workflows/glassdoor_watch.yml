name: Glassdoor Watcher

on:
  # Glassdoor is scraped by the local runner (scripts/local_runner.py, docs/local-runner.md), not on a
  # schedule here: Glassdoor's Cloudflare answers GitHub-hosted runners with an instant 403 on every
  # page (verified 2026-09-24), so a scheduled run can never collect anything. This manual trigger is
  # kept for testing, and it works if the repository ever gets a runner on an unblocked network.
  workflow_dispatch:
    inputs:
      backfill:
        description: "One-time backfill: fetch last 7 days instead of the last 3 (run once when setting up)"
        required: false
        type: boolean
        default: false

concurrency:
  group: job-scraper-commit-push
  cancel-in-progress: false

jobs:
  scrape:
    name: Glassdoor scrape
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install JobSpy deps
        run: pip install -r requirements.txt

      - name: Scrape Glassdoor
        run: |
          if [ "${{ github.event.inputs.backfill }}" = "true" ]; then
            python scrape_jobs.py --glassdoor-backfill
          else
            python scrape_jobs.py --glassdoor-only
          fi
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          NOTIFY_MIN_FIT: ${{ vars.NOTIFY_MIN_FIT }}
          JOBSPY_PROXIES: ${{ secrets.JOBSPY_PROXIES }}
          JOBSPY_USER_AGENT: ${{ vars.JOBSPY_USER_AGENT }}

      - name: Record workflow run
        run: |
          python - <<'EOF'
          import json
          import os
          from datetime import datetime, timezone

          with open("output/glassdoor_jobs.json", encoding="utf-8") as f:
              data = json.load(f)

          entry = {
              "workflow": "glassdoor",
              "timestamp": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "job_count": int(data.get("total", 0)),
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT", ""),
          }

          with open("output/workflow_runs.jsonl", "a", encoding="utf-8") as f:
              f.write(json.dumps(entry, sort_keys=True) + "\n")
          EOF

      - name: Add geography (office location, distance from home)
        # Fail soft: a geocoding/research problem must never block saving scraped jobs.
        continue-on-error: true
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then pip install --quiet anthropic; fi
          python enrich_geography.py output/glassdoor_jobs.json output/all_jobs.json
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit results to repo
        if: vars.ENABLE_DATA_COMMITS == 'true'
        run: |
          git config user.name  "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add -f output/glassdoor_jobs.json output/glassdoor_jobs.md output/glassdoor_jobs.html output/workflow_runs.jsonl output/all_jobs.json output/notified.json
          # geo_cache.json is only written when enrich_geography.py actually
          # changes something (see its no-op guard); a light run may not touch it.
          [ -f output/geo_cache.json ] && git add -f output/geo_cache.json || true
          git diff --cached --quiet || git commit -m "chore: update glassdoor listings [$(date -u '+%Y-%m-%d %H:%MZ')]"
          git pull --rebase -X ours origin main
          git push

name: Indeed Watcher

on:
  # FALLBACK since 2026-09-26. The local runner (scripts/local_runner.py) scrapes Indeed every
  # 30 minutes from a home connection; the `fresh` job below stands this workflow down while it
  # does. GitHub's cron delivered 8 of 48 "hourly" runs in 2 days with gaps up to 12.9h, so it
  # cannot be the primary. Hourly around the clock: the old 15:00-03:00 UTC window skipped the
  # Toronto morning, which is exactly when a sleeping Mac needs covering.
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "One-time backfill: fetch last 7 days instead of last 24h (run once when setting up)"
        required: false
        type: boolean
        default: false

concurrency:
  group: job-scraper-commit-push
  cancel-in-progress: false

jobs:
  fresh:
    name: Stand down if the local runner has Indeed covered
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            output/scrape_state.json
            scripts/skip_if_fresh.py
          sparse-checkout-cone-mode: false
      - id: check
        # Runner cadence is 30 min and it publishes at least every 30; 75 allows one miss.
        run: python3 scripts/skip_if_fresh.py indeed 75
        env:
          BACKFILL: ${{ github.event.inputs.backfill }}

  scrape:
    name: Indeed scrape
    needs: fresh
    if: needs.fresh.outputs.skip != 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Indeed deps
        run: pip install -r requirements.txt

      - name: Scrape Indeed (last 24h, or 7-day backfill)
        run: |
          if [ "${{ github.event.inputs.backfill }}" = "true" ]; then
            python scrape_jobs.py --indeed-backfill
          else
            python scrape_jobs.py --indeed-only
          fi
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          NOTIFY_MIN_FIT: ${{ vars.NOTIFY_MIN_FIT }}
          JOBSPY_PROXIES: ${{ secrets.JOBSPY_PROXIES }}
          JOBSPY_USER_AGENT: ${{ vars.JOBSPY_USER_AGENT }}

      - name: Record workflow run
        run: |
          python - <<'EOF'
          import json
          import os
          from datetime import datetime, timezone

          with open("output/indeed_jobs.json", encoding="utf-8") as f:
              data = json.load(f)

          entry = {
              "workflow": "indeed",
              "timestamp": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "job_count": int(data.get("total", 0)),
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT", ""),
          }

          with open("output/workflow_runs.jsonl", "a", encoding="utf-8") as f:
              f.write(json.dumps(entry, sort_keys=True) + "\n")
          EOF

      - name: Add geography (office location, distance from home)
        # Fail soft: a geocoding/research problem must never block saving scraped jobs.
        continue-on-error: true
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then pip install --quiet anthropic; fi
          python enrich_geography.py output/indeed_jobs.json output/all_jobs.json
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit results to repo
        if: vars.ENABLE_DATA_COMMITS == 'true'
        run: |
          git config user.name  "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add -f output/indeed_jobs.json output/indeed_jobs.md output/indeed_jobs.html output/workflow_runs.jsonl output/all_jobs.json output/notified.json
          # geo_cache.json is only written when enrich_geography.py actually
          # changes something (see its no-op guard); a light run may not touch it.
          [ -f output/geo_cache.json ] && git add -f output/geo_cache.json || true
          git diff --cached --quiet || git commit -m "chore: update indeed listings [$(date -u '+%Y-%m-%d %H:%MZ')]"
          git pull --rebase -X ours origin main
          git push
